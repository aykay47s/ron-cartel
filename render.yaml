services:
  - type: web
    name: ron-cartel-app
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm ci --omit=dev
    startCommand: node src/index.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Set once in the Render dashboard (Environment tab). Never committed.
      # Render's own free Postgres is not an option here: the account already
      # has one, used by KS Exchange, and only one free database is allowed.
      - key: DATABASE_URL
        sync: false
