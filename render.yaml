databases:
  - name: ron-cartel-db
    plan: free
    region: ohio

services:
  - type: web
    name: ron-cartel-app
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm ci --omit=dev
    startCommand: node src/index.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Render creates the database above and injects this itself.
      # Nobody types a password anywhere.
      - key: DATABASE_URL
        fromDatabase:
          name: ron-cartel-db
          property: connectionString
