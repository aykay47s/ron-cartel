services:
  - type: web
    name: ron-cartel-app
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm ci --omit=dev
    startCommand: node src/index.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Set in the Render dashboard. Never committed.
      - key: DATABASE_URL
        sync: false
